name: Bug report
description: Something is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this. Please check existing issues first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: And what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Share a link from ...
        2. Open the inbox ...
        3. See the problem
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Pickle version
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: e.g. iPhone 15, iOS 18 / MacBook Air, Chrome
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
